spring.application.name=ms-usuarios

# Puerto local de ms-usuarios (ver backend/AGENTS.md)
server.port=8081

# Conexion a MySQL (bd_usuarios). Los valores reales se leen desde variables de
# entorno; nunca escribir aqui la contrasena. Ver .env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: crea o actualiza las tablas a partir de las entidades, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Usa los nombres de campo tal cual (bloqueInicio), sin pasarlos a bloque_inicio.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Muestra en consola el SQL que ejecuta JPA.
spring.jpa.show-sql=true

# Contrasena comun de los usuarios de prueba del dataset (se guarda como hash BCrypt).
# Vacia por defecto: solo se exige si la tabla usuario esta vacia. Ver .env.example.
dataset.password-prueba=${PASSWORD_PRUEBA:}
