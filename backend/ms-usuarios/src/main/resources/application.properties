spring.application.name=ms-usuarios

# Puerto local de ms-usuarios (ver backend/AGENTS.md)
server.port=8081

# Conexion a MySQL (bd_usuarios). Los valores reales se leen desde variables de
# entorno; nunca escribir aqui la contrasena. Ver .env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
