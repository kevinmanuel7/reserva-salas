spring.application.name=ms-salas

# Puerto local de ms-salas (ver backend/AGENTS.md)
server.port=8082

# Conexion a MySQL (bd_salas). Los valores reales se leen desde variables de
# entorno; nunca escribir aqui la contrasena. Ver .env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: crea o actualiza las tablas a partir de las entidades, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Usa los nombres de campo tal cual (tieneProyector), sin pasarlos a tiene_proyector.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Muestra en consola el SQL que ejecuta JPA.
spring.jpa.show-sql=true

# JWT. La clave se lee como texto UTF-8 (minimo 32 caracteres) y debe ser la misma
# en los tres microservicios. Ver .env.example.
jwt.secret=${JWT_SECRET:}

# Origenes de la web permitidos por CORS. Ver .env.example.
cors.origins=${CORS_ORIGINS}
